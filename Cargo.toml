[package]
name = "jsonwebtoken-google2"
version = "0.3.0"
edition = "2024"
description = "parse and validate google jwt token with jsonwebtoken"
license = "MIT/Apache-2.0"
readme = "README.md"
keywords = ["google", "jwt", "sign", "token", "android"]
repository = "https://github.com/qwandor/jsonwebtoken-google2"

[dependencies]
jsonwebtoken = "12.0.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
headers = "0.4.1"
tokio = "1.0"
httpmock = { version = "0.9.0", optional = true }
rustls = { version = "0.23.42" }
base64 = { version = "0.23.1", optional = true }
thiserror = "2.0.18"
rand = { version = "0.10.3", optional = true }

[dev-dependencies]
base64 = { version = "0.23.1" }
crypto-bigint = "0.7.11"
httpmock = { version = "0.9.0" }
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
rsa = "0.10.0"

[features]
test-helper = ["dep:httpmock", "dep:base64", "dep:rand"]
